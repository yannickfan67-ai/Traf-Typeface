name: Build and QA

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install font production tools
        run: pip install -r requirements.txt
      - name: Build TTF
        run: make build
      - name: Run FontBakery Google Fonts profile
        run: make test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: traf-typeface-build
          path: |
            fonts/ttf/*.ttf
            build/
