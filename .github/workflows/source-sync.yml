name: Sync v2.100 source fixes

on:
  push:
    paths:
      - "sources/FIX_V2100"

permissions:
  contents: write

jobs:
  sync-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply idempotent UFO compliance fixes
        run: python tools/fix_ufo.py
      - name: Commit fixed UFO source
        run: |
          rm -f sources/FIX_V2100
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A sources/Traf-Regular.ufo sources/FIX_V2100
          git diff --cached --quiet && exit 0
          git commit -m "Apply v2.100 Google Fonts source fixes"
          git push
