name: Build and QA

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install font production tools
        run: pip install -r requirements.txt
      - name: Build TTF
        run: make build
      - name: Run release verification and FontBakery Google Fonts profile
        run: make test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: traf-typeface-build
          path: |
            fonts/ttf/*.ttf
            build/
      - name: Sync normalized UFO source and generated TTF to main
        id: sync_ttf
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- sources/Traf-Regular.ufo fonts/ttf/TrafTypeface-Regular.ttf
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "Committed source and TTF already match the deterministic production build."
          else
            git commit -m "Sync v2.101 source and generated TTF [skip ci]"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare GitHub Release assets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if [[ -e sources/FIX_V2100 ]]; then
            echo "Source-sync marker still present; release waits for the synced-source commit."
            exit 0
          fi
          tar -czf TrafTypeface-v2.101-source.tar.gz \
            sources/Traf-Regular.ufo build.sh Makefile requirements.txt requirements.in \
            tools/fix_ufo.py tools/postprocess_font.py tools/verify_font.py \
            OFL.txt AUTHORS.txt CONTRIBUTORS.txt README.md CHANGELOG.md CONTRIBUTING.md
      - name: Publish or refresh GitHub Release v2.101
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TARGET: ${{ steps.sync_ttf.outputs.sha }}
        run: |
          if [[ -e sources/FIX_V2100 ]]; then
            echo "Source-sync marker still present; skipping release on this commit."
            exit 0
          fi
          if gh release view v2.101 >/dev/null 2>&1; then
            release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v2.101" --jq .id)"
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
              -f target_commitish="$RELEASE_TARGET" \
              -f name="Traf Typeface v2.101" \
              -f body="Traf Typeface v2.101 review-fix release rebuilt from the editable UFO source. The committed TTF and release asset are produced by the same deterministic build, verified with release metadata checks and the Google Fonts FontBakery profile. OS/2 embedding is installable (fsType=0), vendor ID is YTHF, and gasp/prep tables are present. This release also improves I/l differentiation for UI legibility and adds an OpenType slashed-zero alternate."
            gh release upload v2.101 \
              fonts/ttf/TrafTypeface-Regular.ttf \
              TrafTypeface-v2.101-source.tar.gz \
              OFL.txt \
              --clobber
          else
            gh release create v2.101 \
              fonts/ttf/TrafTypeface-Regular.ttf \
              TrafTypeface-v2.101-source.tar.gz \
              OFL.txt \
              --target "$RELEASE_TARGET" \
              --title "Traf Typeface v2.101" \
              --notes "Traf Typeface v2.101 review-fix release rebuilt from the editable UFO source. The committed TTF and release asset are produced by the same deterministic build, verified with release metadata checks and the Google Fonts FontBakery profile. This release improves I/l differentiation for UI legibility and adds an OpenType slashed-zero alternate."
          fi
